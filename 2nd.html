<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AuraCalc | History-Enabled Neon Calculator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #0a0c15 0%, #05080f 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, 'Poppins', sans-serif;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 40% 30%, rgba(0, 198, 255, 0.06), transparent 70%);
      pointer-events: none;
    }

    .app-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      gap: 1.5rem;
      max-width: 900px;
      width: 100%;
    }

    .calculator {
      background: rgba(12, 18, 30, 0.7);
      backdrop-filter: blur(20px);
      border-radius: 2rem;
      padding: 1.5rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(0, 198, 255, 0.15);
      transition: all 0.3s ease;
      animation: fadeSlideUp 0.5s ease-out;
      flex-shrink: 0;
    }

    .history-panel {
      background: rgba(12, 18, 30, 0.6);
      backdrop-filter: blur(20px);
      border-radius: 2rem;
      padding: 1.5rem;
      width: 100%;
      max-width: 280px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(0, 198, 255, 0.1);
      animation: fadeSlideUp 0.5s ease-out 0.1s both;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      max-height: 500px;
    }

    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid rgba(0, 198, 255, 0.25);
    }

    .history-header h3 {
      font-size: 1.1rem;
      font-weight: 500;
      color: #cbd5e1;
      letter-spacing: 1px;
    }

    .clear-history-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 0.75rem;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 20px;
      transition: 0.2s;
    }

    .clear-history-btn:hover {
      color: #ff8a7a;
      background: rgba(255, 80, 80, 0.15);
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      padding-right: 4px;
    }

    .history-item {
      background: rgba(25, 32, 48, 0.5);
      border-radius: 1rem;
      padding: 0.7rem 0.9rem;
      font-size: 0.8rem;
      border-left: 2px solid #00c6ff;
      transition: 0.2s;
      word-break: break-word;
    }

    .history-item:hover {
      background: rgba(40, 50, 70, 0.6);
      transform: translateX(2px);
    }

    .history-expression {
      color: #b9c7dd;
      font-family: monospace;
      font-size: 0.75rem;
    }

    .history-result {
      color: #00f5d4;
      font-weight: 500;
      margin-top: 4px;
      font-size: 0.85rem;
    }

    .empty-history {
      text-align: center;
      color: #4a5568;
      font-size: 0.8rem;
      padding: 1rem;
    }

    .history-list::-webkit-scrollbar {
      width: 3px;
    }

    .history-list::-webkit-scrollbar-track {
      background: #1e293b;
      border-radius: 10px;
    }

    .history-list::-webkit-scrollbar-thumb {
      background: #00c6ff;
      border-radius: 10px;
    }

    .display {
      background: rgba(0, 0, 0, 0.45);
      border-radius: 1.5rem;
      padding: 1.2rem 1.2rem;
      margin-bottom: 1.8rem;
      text-align: right;
      border: 1px solid rgba(0, 198, 255, 0.2);
    }

    .previous-operand {
      font-size: 0.8rem;
      color: #94a3b8;
      min-height: 22px;
      letter-spacing: 0.5px;
    }

    .current-operand {
      font-size: 2.3rem;
      font-weight: 500;
      color: #ffffff;
      font-family: 'Inter', monospace;
      letter-spacing: 1px;
      word-break: break-word;
      line-height: 1.2;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      background: rgba(25, 32, 48, 0.7);
      border: none;
      padding: 0.9rem 0;
      border-radius: 1.2rem;
      font-size: 1.2rem;
      font-weight: 500;
      color: #e2e8f0;
      font-family: 'Inter', system-ui;
      cursor: pointer;
      transition: all 0.2s ease;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.03);
      position: relative;
      overflow: hidden;
    }

    button:hover {
      background: rgba(45, 55, 80, 0.8);
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(1px);
    }

    .operator {
      background: rgba(0, 150, 200, 0.2);
      color: #7ee7ff;
      border-color: rgba(0, 198, 255, 0.2);
    }

    .operator:hover {
      background: rgba(0, 170, 220, 0.35);
      color: #aaf0ff;
    }

    .equal {
      background: linear-gradient(105deg, rgba(0, 180, 220, 0.6), rgba(0, 220, 190, 0.5));
      color: white;
      font-weight: 600;
    }

    .equal:hover {
      background: linear-gradient(105deg, rgba(0, 200, 240, 0.7), rgba(0, 240, 210, 0.6));
      box-shadow: 0 0 12px rgba(0, 198, 255, 0.3);
    }

    .action {
      background: rgba(100, 80, 180, 0.2);
      color: #c4b5fd;
    }

    .action:hover {
      background: rgba(120, 100, 200, 0.35);
    }

    .number {
      background: rgba(20, 28, 42, 0.6);
    }

    @media (max-width: 750px) {
      .app-container {
        flex-direction: column;
        align-items: center;
      }

      .history-panel {
        max-width: 400px;
        width: 100%;
        max-height: 320px;
      }

      .calculator {
        max-width: 400px;
      }
    }

    @media (max-width: 450px) {
      .calculator,
      .history-panel {
        padding: 1.2rem;
      }

      .buttons {
        gap: 10px;
      }

      button {
        padding: 0.7rem 0;
        font-size: 1rem;
      }

      .current-operand {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>

<div class="app-container">
  <div class="calculator">
    <div class="display">
      <div class="previous-operand" id="previousDisplay"></div>
      <div class="current-operand" id="currentDisplay">0</div>
    </div>

    <div class="buttons">
      <button class="action" data-action="clear">C</button>
      <button class="action" data-action="delete">⌫</button>
      <button class="action" data-action="percentage">%</button>
      <button class="operator" data-operator="divide">÷</button>

      <button class="number" data-number="7">7</button>
      <button class="number" data-number="8">8</button>
      <button class="number" data-number="9">9</button>
      <button class="operator" data-operator="multiply">×</button>

      <button class="number" data-number="4">4</button>
      <button class="number" data-number="5">5</button>
      <button class="number" data-number="6">6</button>
      <button class="operator" data-operator="subtract">−</button>

      <button class="number" data-number="1">1</button>
      <button class="number" data-number="2">2</button>
      <button class="number" data-number="3">3</button>
      <button class="operator" data-operator="add">+</button>

      <button class="number" data-number="0">0</button>
      <button class="number" data-number=".">.</button>
      <button class="equal" id="equalBtn">=</button>
      <div style="opacity: 0; pointer-events: none;"></div>
    </div>
  </div>

  <div class="history-panel">
    <div class="history-header">
      <h3>📜 History</h3>
      <button class="clear-history-btn" id="clearHistoryBtn">Clear all</button>
    </div>

    <div class="history-list" id="historyList">
      <div class="empty-history">— no calculations yet —</div>
    </div>
  </div>
</div>

<script>
  let currentOperand = '0';
  let previousOperand = '';
  let operation = null;
  let shouldResetScreen = false;

  let historyEntries = [];

  const previousDisplay = document.getElementById('previousDisplay');
  const currentDisplay = document.getElementById('currentDisplay');
  const historyListEl = document.getElementById('historyList');
  const clearHistoryBtn = document.getElementById('clearHistoryBtn');

  function formatDisplayNumber(numStr) {
    if (numStr === 'Error') return 'Error';

    let num = parseFloat(numStr);

    if (isNaN(num)) return numStr;

    if (numStr.length > 14 && numStr.includes('.')) {
      return num.toFixed(8).replace(/\.?0+$/, '');
    }

    return numStr;
  }

  function updateDisplay() {
    if (
      currentOperand === 'Error' ||
      currentOperand === 'Infinity' ||
      currentOperand === 'NaN'
    ) {
      currentDisplay.textContent = 'Error';
      previousDisplay.textContent = '';
      return;
    }

    let displayValue = formatDisplayNumber(currentOperand);
    currentDisplay.textContent = displayValue;

    if (operation && previousOperand !== '') {
      let opSymbol = '';

      if (operation === 'add') opSymbol = '+';
      else if (operation === 'subtract') opSymbol = '−';
      else if (operation === 'multiply') opSymbol = '×';
      else if (operation === 'divide') opSymbol = '÷';

      previousDisplay.textContent =
        `${formatDisplayNumber(previousOperand)} ${opSymbol}`;
    } else {
      previousDisplay.textContent =
        previousOperand ? formatDisplayNumber(previousOperand) : '';
    }
  }

  function addToHistory(expression, resultValue) {
    if (expression === undefined || resultValue === undefined) return;

    let cleanResult = resultValue.toString();

    if (
      !isNaN(parseFloat(cleanResult)) &&
      cleanResult.includes('.')
    ) {
      cleanResult = parseFloat(cleanResult).toString();
    }

    historyEntries.unshift({
      expression,
      result: cleanResult
    });

    if (historyEntries.length > 20) historyEntries.pop();

    renderHistory();
  }

  function renderHistory() {
    if (!historyListEl) return;

    if (historyEntries.length === 0) {
      historyListEl.innerHTML =
        '<div class="empty-history">✨ no calculations yet</div>';
      return;
    }

    historyListEl.innerHTML = '';

    historyEntries.forEach(entry => {
      const historyItem = document.createElement('div');

      historyItem.className = 'history-item';

      historyItem.innerHTML = `
        <div class="history-expression">${escapeHtml(entry.expression)}</div>
        <div class="history-result">= ${escapeHtml(entry.result)}</div>
      `;

      historyListEl.appendChild(historyItem);
    });
  }

  function escapeHtml(str) {
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  function clearHistory() {
    historyEntries = [];
    renderHistory();
  }

  function handleNumber(number) {
    if (shouldResetScreen) {
      currentOperand = '';
      shouldResetScreen = false;
    }

    if (number === '.') {
      if (currentOperand === '') currentOperand = '0';
      if (currentOperand.includes('.')) return;
      currentOperand += '.';
    } else {
      if (
        currentOperand === '0' &&
        !currentOperand.includes('.')
      ) {
        currentOperand = number;
      } else {
        currentOperand += number;
      }
    }

    updateDisplay();
  }

  function handleOperator(op) {
    if (
      currentOperand === '' ||
      currentOperand === 'Error'
    ) return;

    if (
      previousOperand !== '' &&
      !shouldResetScreen
    ) {
      computeResult();
    }

    operation = op;
    previousOperand = currentOperand;
    shouldResetScreen = true;

    updateDisplay();
  }

  function getExpressionString(prev, op, curr) {
    let opSymbol = '';

    if (op === 'add') opSymbol = '+';
    else if (op === 'subtract') opSymbol = '−';
    else if (op === 'multiply') opSymbol = '×';
    else if (op === 'divide') opSymbol = '÷';

    return `${formatDisplayNumber(prev)} ${opSymbol} ${formatDisplayNumber(curr)}`;
  }

  function computeResult() {
    if (
      operation === null ||
      previousOperand === '' ||
      currentOperand === ''
    ) return;

    if (currentOperand === 'Error') {
      clearAll();
      return;
    }

    const prev = parseFloat(previousOperand);
    const current = parseFloat(currentOperand);

    if (isNaN(prev) || isNaN(current)) {
      clearAll();
      return;
    }

    let result;

    switch (operation) {
      case 'add':
        result = prev + current;
        break;

      case 'subtract':
        result = prev - current;
        break;

      case 'multiply':
        result = prev * current;
        break;

      case 'divide':
        if (current === 0) {
          currentOperand = 'Error';
          previousOperand = '';
          operation = null;
          updateDisplay();
          return;
        }

        result = prev / current;
        break;

      default:
        return;
    }

    result =
      Math.round(result * 10000000000) / 10000000000;

    const expressionStr =
      getExpressionString(
        previousOperand,
        operation,
        currentOperand
      );

    const finalResult = result.toString();

    addToHistory(expressionStr, finalResult);

    currentOperand = finalResult;
    operation = null;
    previousOperand = '';
    shouldResetScreen = true;

    updateDisplay();
  }

  function clearAll() {
    currentOperand = '0';
    previousOperand = '';
    operation = null;
    shouldResetScreen = false;

    updateDisplay();
  }

  function deleteLast() {
    if (shouldResetScreen) {
      clearAll();
      return;
    }

    if (currentOperand === 'Error') {
      clearAll();
      return;
    }

    if (
      currentOperand.length === 1 ||
      currentOperand === '0'
    ) {
      currentOperand = '0';
    } else {
      currentOperand =
        currentOperand.slice(0, -1);

      if (currentOperand === '') {
        currentOperand = '0';
      }
    }

    updateDisplay();
  }

  function percentage() {
    if (currentOperand === 'Error') return;

    let value = parseFloat(currentOperand);

    if (!isNaN(value)) {
      currentOperand =
        (value / 100).toString();

      updateDisplay();
    }
  }

  document.querySelectorAll('.number')
    .forEach(btn => {
      btn.addEventListener('click', () => {
        const num =
          btn.getAttribute('data-number');

        if (num !== null) {
          handleNumber(num);
        }
      });
    });

  document.querySelectorAll('.operator')
    .forEach(btn => {
      btn.addEventListener('click', () => {
        const op =
          btn.getAttribute('data-operator');

        if (op) handleOperator(op);
      });
    });

  const clearBtn =
    document.querySelector('[data-action="clear"]');

  if (clearBtn) {
    clearBtn.addEventListener('click', clearAll);
  }

  const delBtn =
    document.querySelector('[data-action="delete"]');

  if (delBtn) {
    delBtn.addEventListener('click', deleteLast);
  }

  const percBtn =
    document.querySelector('[data-action="percentage"]');

  if (percBtn) {
    percBtn.addEventListener('click', percentage);
  }

  const equalBtn =
    document.getElementById('equalBtn');

  if (equalBtn) {
    equalBtn.addEventListener('click', computeResult);
  }

  if (clearHistoryBtn) {
    clearHistoryBtn.addEventListener('click', clearHistory);
  }

  window.addEventListener('keydown', (e) => {
    const key = e.key;

    if (
      (key >= '0' && key <= '9') ||
      key === '.'
    ) {
      e.preventDefault();
      handleNumber(key);

    } else if (key === '+') {
      e.preventDefault();
      handleOperator('add');

    } else if (key === '-') {
      e.preventDefault();
      handleOperator('subtract');

    } else if (key === '*') {
      e.preventDefault();
      handleOperator('multiply');

    } else if (key === '/') {
      e.preventDefault();
      handleOperator('divide');

    } else if (
      key === 'Enter' ||
      key === '='
    ) {
      e.preventDefault();
      computeResult();

    } else if (key === 'Backspace') {
      e.preventDefault();
      deleteLast();

    } else if (
      key === 'Escape' ||
      key === 'c' ||
      key === 'C'
    ) {
      e.preventDefault();
      clearAll();

    } else if (key === '%') {
      e.preventDefault();
      percentage();
    }
  });

  const allBtns =
    document.querySelectorAll('button');

  allBtns.forEach(btn => {
    btn.addEventListener('click', function(e) {

      const rect =
        this.getBoundingClientRect();

      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      const ripple =
        document.createElement('span');

      ripple.style.position = 'absolute';
      ripple.style.left = `${x}px`;
      ripple.style.top = `${y}px`;
      ripple.style.width = '6px';
      ripple.style.height = '6px';
      ripple.style.background =
        'rgba(0, 198, 255, 0.5)';
      ripple.style.borderRadius = '50%';
      ripple.style.transform = 'scale(0)';
      ripple.style.transition =
        'transform 0.4s ease-out, opacity 0.4s';
      ripple.style.pointerEvents = 'none';
      ripple.style.opacity = '0.8';

      this.appendChild(ripple);

      requestAnimationFrame(() => {
        ripple.style.transform = 'scale(35)';
        ripple.style.opacity = '0';
      });

      setTimeout(() => ripple.remove(), 400);
    });
  });

  updateDisplay();
  renderHistory();
</script>

</body>
</html>
